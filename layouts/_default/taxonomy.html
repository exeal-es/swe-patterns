{{ define "main" }}
{{ partial "page-hero.html" (dict "kicker" "$ ls tags/" "title" "Tags" "sub" "Explora los patrones por tema.") }}
<section class="section-light">
  <div class="container">
    <ul class="tags tags-dark tags-cloud">
      {{ range .Pages.ByTitle }}
      <li><a href="{{ .Permalink }}">#{{ .Title }} <span class="count">{{ len .Pages }}</span></a></li>
      {{ end }}
    </ul>
  </div>
</section>
{{ end }}
