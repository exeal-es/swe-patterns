{{ define "main" }}
{{ partial "page-hero.html" (dict "kicker" "$ grep -l tag" "title" (printf "#%s" .Title) "sub" (printf "%d patrones con este tag." (len .Pages))) }}
<section class="section-light">
  <div class="container">
    <div class="card-grid">
      {{ range .Pages.ByDate.Reverse }}
        {{ partial "pattern-card.html" . }}
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
